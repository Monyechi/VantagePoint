[package]
name = "clientpilot"
version = "0.1.0"
description = "ClientPilot AI Workforce OS — AI BDR"
authors = ["ClientPilot"]
edition = "2021"

[lib]
name = "clientpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
