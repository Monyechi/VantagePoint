name: Release

# Runs only on version tags (e.g. v0.1.1) pushed to the repo — not on every commit to main.
# Publishes a draft GitHub Release so nothing goes live to users until you review and
# publish it yourself from the GitHub UI.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS build is unsigned (no Apple Developer account) — installs show a
          # Gatekeeper "unidentified developer" warning until that's added. Universal
          # binary covers both Apple Silicon and Intel Macs in one build.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VantagePoint ${{ github.ref_name }}"
          releaseBody: "See assets below to download this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
